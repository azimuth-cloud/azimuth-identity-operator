[project]
name = "azimuth-identity"
dynamic = ["version"]
requires-python = ">=3.12"
authors = [
    {name = "Matt Pryor"}
]
maintainers = [
    {name = "Alex Manning", email = "alexm@stackhpc.com"},
]
readme = "README.md"
license = "Apache-2.0"

dependencies = [
    "aiohttp>=3.14.5",
    "configomatic>=0.4.0",
    "easykube>=0.6.0",
    "kopf>=1.44.6",
    "kube-custom-resource>=0.7.2",
    "pydantic>=2.14.1,<3",
    "pyhelm3>=0.5.8",
    "pytest-httpserver>=1.2.0",
    "pytest-httpx>=0.36.2",
]

[dependency-groups]
dev = [
    "codespell>=2.4.3",
    "coverage>=7.16.2",
    "diff-cover>=10.0.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "tox>=4.64.6",
    "tox-uv>=1.36.0",
]

[tool.uv]
exclude-newer = "7 days"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.1+unknown"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # flake8-builtins
    "A",
    # Ruff rules
    "RUF",
    # flake8-async
    "ASYNC",
    # pyupgrade
    "UP",
    # tidy imports
    "TID",
    # sorted imports
    "I",
    # check complexity
    "C90",
    # pep8 naming
    "N",
]
ignore = []

[tool.pytest]
testpaths = ["azimuth_identity/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.ruff.lint.mccabe]
# Flag errors (`C901`) whenever the complexity level exceeds 5.
max-complexity = 14
