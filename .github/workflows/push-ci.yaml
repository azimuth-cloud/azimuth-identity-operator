name: Basic CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  helm_lint:
    uses: ./.github/workflows/helm-lint.yaml
    with:
       ref: ${{ github.event.pull_request.head.sha }}

  python-check:
    uses: ./.github/workflows/tox.yaml
    with:
       ref: ${{ github.event.pull_request.head.sha }}